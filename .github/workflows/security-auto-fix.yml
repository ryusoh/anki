name: Security Auto-Fix

on:
  schedule:
    - cron: "0 9 * * 1"  # Every Monday at 9 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Force JavaScript actions to use Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-fix:
    runs-on: ubuntu-latest
    steps:
      # codeql[js/unpinned-tag] Pinned to actions/checkout@v4 SHA: 1d96c772d19495a8b5c518327404a044394fcf99
      - uses: actions/checkout@1d96c772d19495a8b5c518327404a044394fcf99

      - name: Setup Node.js
        # codeql[js/unpinned-tag] Pinned to actions/setup-node@v4 SHA: 60edb5dd545a775178f3fbe5982d69cde1959bb0
        uses: actions/setup-node@60edb5dd545a775178f3fbe5982d69cde1959bb0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit fix
        run: npm audit fix
        continue-on-error: true

      - name: Create PR if vulnerabilities found
        # codeql[js/unpinned-tag] Pinned to peter-evans/create-pull-request@v7 SHA: 05247413d7197b1ca696752d5e56e9e4325e01b4
        uses: peter-evans/create-pull-request@05247413d7197b1ca696752d5e56e9e4325e01b4
        with:
          commit-message: "security: auto-fix npm vulnerabilities"
          title: "security: fix npm vulnerabilities"
          body: |
            Automated security fix PR
            
            This PR was created by running `npm audit fix` to resolve known vulnerabilities.
            
            Please review and merge if tests pass.
          branch: "security/npm-audit-fix"
          base: "main"
          labels: |
            security
            automated
          delete-branch: true
