name: Security Auto-Fix

on:
  schedule:
    - cron: "0 9 * * 1"  # Every Monday at 9 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Force JavaScript actions to use Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit fix
        run: npm audit fix
        continue-on-error: true

      - name: Create PR if vulnerabilities found
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "security: auto-fix npm vulnerabilities"
          title: "security: fix npm vulnerabilities"
          body: |
            Automated security fix PR
            
            This PR was created by running `npm audit fix` to resolve known vulnerabilities.
            
            Please review and merge if tests pass.
          branch: "security/npm-audit-fix"
          base: "main"
          labels: |
            security
            automated
          delete-branch: true
