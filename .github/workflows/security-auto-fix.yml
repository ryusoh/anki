name: Security Auto-Fix

on:
  schedule:
    - cron: "0 9 * * 1"  # Every Monday at 9 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Force JavaScript actions to use Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-fix:
    runs-on: ubuntu-latest
    steps:
      # codeql[js/unpinned-tag] Pinned to actions/checkout@v4.2.2 SHA: 11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        # codeql[js/unpinned-tag] Pinned to actions/setup-node@v4.1.0 SHA: 39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit fix
        run: npm audit fix
        continue-on-error: true

      - name: Create PR if vulnerabilities found
        # codeql[js/unpinned-tag] Tag v7.0.5 pinned to SHA: 5e914681df9dc83aa4e4905692ca88beb2f9e91f
        uses: peter-evans/create-pull-request@5e914681df9dc83aa4e4905692ca88beb2f9e91f
        with:
          commit-message: "security: auto-fix npm vulnerabilities"
          title: "security: fix npm vulnerabilities"
          body: |
            Automated security fix PR
            
            This PR was created by running `npm audit fix` to resolve known vulnerabilities.
            
            Please review and merge if tests pass.
          branch: "security/npm-audit-fix"
          base: "main"
          labels: |
            security
            automated
          delete-branch: true
