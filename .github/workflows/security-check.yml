name: Security Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

# Force JavaScript actions to use Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      # codeql[js/unpinned-tag] Pinned to actions/checkout@v4.2.2 SHA: 11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        # codeql[js/unpinned-tag] Pinned to actions/setup-node@v4.1.0 SHA: 39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run npm audit (GitHub format)
        run: npm audit --json > audit-results.json || true

      - name: Upload audit results
        # codeql[js/unpinned-tag] Pinned to actions/upload-artifact@v4.6.1 SHA: 4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: npm-audit-results
          path: audit-results.json
          retention-days: 30

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      # codeql[js/unpinned-tag] Pinned to actions/checkout@v4.2.2 SHA: 11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        # codeql[js/unpinned-tag] Pinned to actions/setup-python@v5 SHA: a26af69be951a213d495a4c3e4e4022e16d87065
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Run pip-audit
        # Baseline verified clean locally (pip-audit 2.10.1); unlike the npm
        # audit above, this is blocking — fails the job on any known
        # vulnerability in requirements.txt / requirements-dev.txt.
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt
