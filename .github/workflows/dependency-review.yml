name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Force JavaScript actions to use Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        # codeql[js/unpinned-tag] Pinned to actions/checkout@v4.2.2 SHA: 11bd71901bbe5b1630ceea73d27597364c9af683
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Dependency Review
        # codeql[js/unpinned-tag] Pinned to actions/dependency-review-action@v4.5.0 SHA: 3b139cfc5fae8b618d3eae3675e383bb1769c019
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0
