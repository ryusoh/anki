name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Force JavaScript actions to use Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  precommit:
    runs-on: ubuntu-latest
    steps:
      # codeql[js/unpinned-tag] Pinned to actions/checkout@v4.2.2 SHA: 11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node.js
        # codeql[js/unpinned-tag] Pinned to actions/setup-node@v4.1.0 SHA: 39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Python
        # codeql[js/unpinned-tag] Pinned to actions/setup-python@v5 SHA: a26af69be951a213d495a4c3e4e4022e16d87065
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies (runtime + dev/lint, pinned)
        run: pip install -r requirements-dev.txt

      # Mirrors `make precommit SKIP=1`: fmt-check + lint (JS/CSS/MD) +
      # quality-py (ruff/black/mypy/bandit) + check (check-node + check-py),
      # with no interactive fetch/R2 prompts and no auto-fixing.
      - name: Run pre-commit checks
        run: make precommit SKIP=1
