name: Claude PR Review

on:
    pull_request:
        types: [opened, synchronize]

jobs:
    review:
        if: github.actor != 'claude[bot]'
        runs-on: ubuntu-latest
        env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        permissions:
            contents: read
            pull-requests: write
            id-token: write
        steps:
            - uses: anthropics/claude-code-action@8cf3482550831fb35a4fc3fbf7ca139cf8028b4c # v1

              with:
                  prompt: |
                      Review this PR. Focus on:
                      - Correctness and potential bugs
                      - Performance concerns
                      - Code style consistency with the rest of the codebase
                      Be concise. Only comment on things that matter.
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
