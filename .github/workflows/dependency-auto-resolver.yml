name: Dependency Auto-Resolver

on:
  schedule:
    - cron: "0 10 * * 1" # Every Monday at 10 AM UTC (after security fix)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve-conflicts:
    runs-on: ubuntu-latest
    steps:
      # codeql[js/unpinned-tag] Pinned to actions/checkout@v4 SHA: 1d96c772d19495a8b5c518327404a044394fcf99
      - uses: actions/checkout@1d96c772d19495a8b5c518327404a044394fcf99

      - name: Setup Node.js
        # codeql[js/unpinned-tag] Pinned to actions/setup-node@v4 SHA: 60edb5dd545a775178f3fbe5982d69cde1959bb0
        uses: actions/setup-node@60edb5dd545a775178f3fbe5982d69cde1959bb0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Force resolve undici/jsdom conflict
        run: |
          # Try to install the specific versions that Dependabot is struggling with.
          # npm install will attempt to find a common denominator.
          # If 7.24.2 is not yet in the registry, it will fail gracefully.
          npm install undici@latest jsdom@latest --save-exact || npm install undici@latest jsdom@latest
          
          # Clean up any lockfile mess
          npm install
          
      - name: Create PR if resolution changed
        # codeql[js/unpinned-tag] Pinned to peter-evans/create-pull-request@v7 SHA: 05247413d7197b1ca696752d5e56e9e4325e01b4
        uses: peter-evans/create-pull-request@05247413d7197b1ca696752d5e56e9e4325e01b4
        with:
          commit-message: "chore: auto-resolve dependency conflicts (undici/jsdom)"
          title: "chore: auto-resolve dependency conflicts"
          body: |
            Automated dependency resolution PR.
            
            This PR attempts to force a valid dependency graph for conflicting packages (like `undici` and `jsdom`) where Dependabot might get stuck.
            
            Ran: `npm install undici@latest jsdom@latest`
          branch: "automation/dep-resolution"
          base: "main"
          labels: |
            dependencies
            automated
          delete-branch: true
