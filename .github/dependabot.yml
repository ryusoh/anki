version: 2
updates:
  # npm/JavaScript dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "automated"
    groups:
      production-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # jsdom must stay pinned to exactly 27.0.0. Even the patch bump to
      # 27.0.1 (PR #416) turned out to depend on parse5@^8.0.0 (ESM-only) —
      # despite the registry metadata suggesting otherwise at the time this
      # was first investigated — so every version above 27.0.0 is untrusted
      # until manually re-verified by installing it and re-running
      # `NODE_OPTIONS="--experimental-vm-modules --no-warnings" npx jest
      # review_heatmap/tests/` (see docs/js-testing.md, "jsdom version
      # constraint" section). Jest can't require() an ESM-only transitive
      # dep synchronously without Node >=24.9 (our CI/dev Node is 22.x).
      - dependency-name: "jsdom"
        versions: [">27.0.0"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"
    labels:
      - "dependencies"
      - "github-actions"
