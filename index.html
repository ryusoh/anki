<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://cdn.bootcdn.net https://cdn.baomitu.com; font-src 'self' data: https://fonts.gstatic.com https://unpkg.com https://cdn.bootcdn.net https://cdn.baomitu.com; img-src 'self' data:; connect-src 'self' https://api.lyeutsaon.com; media-src 'self'; frame-src 'none'; object-src 'none';"
    />
    <meta name="description" content="Anki" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="./assets/manifest.webmanifest" />
    <meta property="og:title" content="Anki" />
    <meta property="og:description" content="Anki" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://anki.lyeutsaon.com/" />
    <meta property="og:image" content="./assets/og-image.png" />
    <meta property="og:image:width" content="1447" />
    <meta property="og:image:height" content="965" />
    <meta name="twitter:image" content="./assets/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="view-transition" content="same-origin" />

    <!-- Preconnect removed: using local assets only -->
    <link
      rel="shortcut icon"
      href="./assets/icons/icon-180.png"
      type="image/png"
    />
    <link rel="icon" href="./assets/icons/icon-180.png" type="image/png" />
    <link rel="apple-touch-icon" href="./assets/icons/icon-180.png" />
    <link rel="bookmark" href="./assets/icons/icon-180.png" type="image/png" />
    <!-- Make the web page capable of running as a standalone app -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Anki" />
    <!-- Set status bar style for iOS -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#000000" />
    <!-- iOS splash screen -->
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=auto"
    />
    <title>Anki</title>
    <script type="importmap">
      {
        "imports": {
          "#js/": "./js/",
          "#ui/": "./js/ui/",
          "#utils/": "./js/utils/",
          "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js"
        }
      }
    </script>
    <!-- Load Font Awesome with fallbacks -->
    <script defer src="./js/loader/cdnFallback.js"></script>
    <link
      rel="preload"
      href="./assets/vendor/fonts/fontawesome-webfont.woff2?v=4.7.0"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="stylesheet"
      href="./assets/vendor/css/font-awesome-4.7.0.min.css"
    />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/main_index.css" />
    <link rel="stylesheet" href="./css/container.css" />
    <link rel="stylesheet" href="./css/table.css" />
    <link rel="stylesheet" href="./css/toggle.css" />
    <link rel="stylesheet" href="./css/perf.css" />
    <link rel="stylesheet" href="./css/terminal/responsive.css?v=20240223" />
    <link rel="stylesheet" href="./css/cursor.css" />
    <link rel="stylesheet" href="./css/marquee.css" />
    <script src="./js/vendor/gsap.min.js" data-cfasync="false"></script>
    <script
      type="module"
      src="./js/cursor-init.js"
      data-cfasync="false"
    ></script>
    <script type="module" data-cfasync="false">
      import { initMagneticNav } from "#ui/magnetic_nav.js?v=20240223";
      import { initTiltEffect } from "#ui/tilt_effect.js?v=20240223";
      import { TableGlassEffect } from "#ui/tableGlassEffect.js?v=20240223";
      import { TABLE_GLASS_EFFECT } from "#js/config.js?v=20240223";

      window.addEventListener("DOMContentLoaded", () => {
        const loading = document.getElementById("loading");
        try {
          initMagneticNav();
          initTiltEffect();

          // Reveal content and hide spinner
          const appContent = document.getElementById("appContent");
          if (appContent) appContent.classList.add("ready");
          if (loading) {
            loading.style.opacity = "0";
            setTimeout(() => (loading.style.display = "none"), 500);
          }
        } catch (err) {
          console.error("Initialization failed", err);
          if (loading) loading.style.display = "none";
        }
      });
    </script>
  </head>

  <body class="body-main no-pull-to-refresh">
    <style>
      /* Hide all content until ready — only spinner visible */
      .app-content {
        visibility: hidden;
      }
      .app-content.ready {
        visibility: visible;
      }
    </style>
    <div id="loading">
      <div class="spinner"></div>
    </div>
    <div class="app-content" id="appContent">
      <div class="marquee-wrapper" aria-hidden="true">
        <div class="marquee-container marquee-left">
          <div class="marquee-content">
            <span>ALL THOSE MOMENTS WILL BE LOST IN TIME</span>
          </div>
        </div>
        <div class="marquee-container marquee-right">
          <div class="marquee-content">
            <span>LIKE TEARS IN RAIN</span>
          </div>
        </div>
      </div>

      <div class="mobile-landing" aria-hidden="true">
        <div class="video-background">
          <video
            autoplay
            loop
            muted
            playsinline
            preload="metadata"
            poster="./assets/mobile_bg.jpg"
            src="./assets/mobile_bg.mp4"
            webkit-playsinline
          ></video>
        </div>
        <img
          class="mobile-banner"
          alt="Anki Stats"
          loading="lazy"
          data-fallbacks='[
                    "./assets/banners/banner.png"
                ]'
        />
      </div>

      <div class="nav-container">
        <ul>
          <li>
            <a href="https://www.lyeutsaon.com/" aria-label="Main Site">
              <i class="fa fa-chevron-right"></i>
            </a>
          </li>
          <li>
            <a href="./graph/" aria-label="Graph">
              <i class="fa fa-connectdevelop"></i>
            </a>
          </li>
          <li>
            <a href="./terminal/" aria-label="Terminal">
              <i class="fa fa-code"></i>
            </a>
          </li>
        </ul>
      </div>

      <footer>
        <a
          href="https://github.com/ryusoh"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub Profile"
        >
          <i
            class="fa fa-github"
            style="color: #aaa; opacity: 0.5"
            aria-hidden="true"
          ></i>
        </a>
      </footer>
    </div>
    <!-- .app-content -->
    <!-- Image fallback and Ambient via CDN fallback loader -->
    <script defer src="./js/loader/imageFallback.js"></script>
    <script defer src="./js/ambient/loader.js"></script>
    <script defer src="./js/ui/reduced_motion.js"></script>
    <script src="./js/ui/scroll_control.js"></script>
    <script defer src="./js/ui/icon_font_ready.js"></script>
    <script defer src="./js/ui/nav_current_page.js"></script>
    <script defer src="./js/ui/nav_prefetch.js"></script>
    <script defer src="./js/ui/video_warmup.js"></script>
    <!-- Video fallback for iOS web app mode -->
    <script type="module">
      import { initVideoFallback } from "./js/ui/videoFallback.js";
      document.addEventListener("DOMContentLoaded", initVideoFallback);
    </script>
    <script
      defer
      src="./js/ui/service_worker_register.js"
      data-sw-path="./sw.js"
      data-sw-scope="./"
    ></script>
    <script type="module" src="./js/ambient/quantum_shader.js"></script>

    <!-- Custom cursor and Marquee -->
    <script type="module" src="./js/ui/marquee.js"></script>
  </body>
</html>
