# Python tooling config (ruff/black). mypy lives in mypy.ini; bandit in .bandit.
# We own and lint the addon source in this repo; only genuinely vendored code is
# excluded — review_heatmap/libaddon (a vendored framework) and any _vendor/
# package trees — plus build/runtime dirs.

[tool.black]
line-length = 100
target-version = ["py39"]
skip-string-normalization = true
extend-exclude = '''
/(
    review_heatmap/libaddon
  | _vendor
  | _vendor_legacy
  | \.venv
  | venv
  | node_modules
  | coverage
  | data
)/
'''

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [
    "review_heatmap/libaddon",
    "_vendor",
    "_vendor_legacy",
    ".venv",
    "venv",
    "node_modules",
    "coverage",
    "data",
]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    # Anki bundles Python 3.9: a PEP 604 union evaluated at def time crashes the
    # addon at load. FA102 forces `from __future__ import annotations` wherever
    # `X | Y` annotations appear (see docs/creating-an-addon.md).
    "FA102",
]
ignore = [
    "E501", # line length handled by black
]

[tool.ruff.lint.per-file-ignores]
# Anki addons manipulate sys.path before importing, so imports are not at the
# top of the module (E402). Tests also re-import fixtures (F401/F811).
"**/tests/**" = ["E402", "F401", "F811"]
"conftest.py" = ["E402"]
"**/__init__.py" = ["F401"]

# Legacy third-party addons with inherent linting issues
"awesome_tts/**" = ["F403", "F405", "F821", "E402"]
"review_heatmap/**" = ["F403", "F405", "F821", "E402"]
"enhance_main_window/**" = ["F403", "F405", "F821", "E402"]
"custom_background/**" = ["F403", "F405", "F821", "E402"]
"animated_glass_background/**" = ["F403", "F405", "F821", "E402"]
"mac_transparent_titlebar/**" = ["F403", "F405", "F821", "E402"]
"hide_window_title/**" = ["F403", "F405", "F821", "E402"]
"hide_deck_collapse/**" = ["F403", "F405", "F821", "E402"]
"toggle_bottom_pane/**" = ["F403", "F405", "F821", "E402"]

# Dependency-structure gate for Python (`make imports-py`, part of quality-py).
# Measured 2026-07-25 with grimp 3.15: unlike the fund repo (namespace packages,
# invisible edges), every addon here is a real package and grimp sees all cross
# edges — 235 files, 355 deps, exactly two cross-addon imports (whitelisted
# below). data/anki is excluded: it is a collection of standalone scripts, not a
# package.
[tool.importlinter]
root_packages = [
    "auto_image",
    "auto_mathjax",
    "auto_wiktionary",
    "graph",
    "highlight_search_matches",
    "prioritize_front_field_search",
    "remove_deck_highlight",
    "rewrite_text_of_study_cards",
    "stats_page_customizer",
    "strip_html_tags",
    "unify_review_count_colors",
    "tabbed_stats",
    "tools",
    "awesome_tts",
    "review_heatmap",
    "enhance_main_window",
    "custom_background",
    "animated_glass_background",
    "mac_transparent_titlebar",
    "hide_window_title",
    "hide_deck_collapse",
    "toggle_bottom_pane",
]

[[tool.importlinter.contracts]]
name = "Addons are self-contained (AGENTS.md: each top-level dir is a self-contained add-on or tool)"
type = "independence"
modules = [
    "auto_image",
    "auto_mathjax",
    "auto_wiktionary",
    "graph",
    "highlight_search_matches",
    "prioritize_front_field_search",
    "remove_deck_highlight",
    "rewrite_text_of_study_cards",
    "stats_page_customizer",
    "strip_html_tags",
    "unify_review_count_colors",
    "tabbed_stats",
    "tools",
    "awesome_tts",
    "review_heatmap",
    "enhance_main_window",
    "custom_background",
    "animated_glass_background",
    "mac_transparent_titlebar",
    "hide_window_title",
    "hide_deck_collapse",
    "toggle_bottom_pane",
]
ignore_imports = [
    # Optional runtime integrations: tabbed_stats reuses these siblings when
    # they happen to be installed, each inside try/except (Anki addons are
    # independently installable, so a hard dependency is not allowed).
    "tabbed_stats -> animated_glass_background",
    "tabbed_stats -> stats_page_customizer",
]

# Mutation-testing scaffold (`make mutate-py` — deliberately NOT part of any
# gate; a full run multiplies the suite runtime by the mutant count). Scoped
# to one small real addon as a smoke target. Run `mutmut results` /
# `mutmut show` after a run for the kill report.
[tool.mutmut]
source_paths = ["strip_html_tags/__init__.py"]
pytest_add_cli_args_test_selection = ["strip_html_tags/tests"]
also_copy = ["strip_html_tags/tests", "conftest.py"]
debug = true
