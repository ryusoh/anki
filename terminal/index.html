      {
        "imports": {
          "#js/": "../js/",
          "#ui/": "../js/ui/"
        }
      }
    </script>
    <script type="module" data-cfasync="false">
      import { TableGlassEffect } from "#ui/tableGlassEffect.js";
      import {
        TABLE_GLASS_EFFECT,
        TERMINAL_GLASS_MAGNIFICATION,
      } from "#js/config.js";
      import { initMagneticNav } from "#ui/magnetic_nav.js";

      window.addEventListener("DOMContentLoaded", () => {
        try {
          initMagneticNav();
          const glassTargets = [
            {
              selector: ".terminal",
              opts: {
                excludeHeader: false,
                refraction: {
                  ...TABLE_GLASS_EFFECT.refraction,
                  frost: "blur(14px) saturate(1.7)",
                  magnification: TERMINAL_GLASS_MAGNIFICATION,
                },
              },
            },
            {
              selector: ".chart-card",
              opts: {
                excludeHeader: false,
                refraction: {
                  ...TABLE_GLASS_EFFECT.refraction,
                  bezelWidth: 16,
                  frost: "blur(20px) saturate(1.7)",
                  magnification: TERMINAL_GLASS_MAGNIFICATION,
                },
              },
            },
            {
              selector: ".table-responsive-container",
              opts: {
                excludeHeader: true,
                refraction: {
                  ...TABLE_GLASS_EFFECT.refraction,
                  bezelWidth: 16,
                  frost: "blur(20px) saturate(1.7)",
                  magnification: TERMINAL_GLASS_MAGNIFICATION,
                },
              },
            },
          ];
          for (const { selector, opts } of glassTargets) {
            try {
              new TableGlassEffect(selector, {
                ...TABLE_GLASS_EFFECT,
                ...opts,
              });
            } catch (e) {
              console.error(`Failed to init glass effect for ${selector}`, e);
            }
          }
        } catch (err) {
          console.error("Failed to init glass effect", err);
        }
      });
    </script>
  </head>

  <body class="body-terminal no-pull-to-refresh">
    <a href="#terminalInput" class="sr-only skip-to-content"
      >Skip to command input</a
    >
    <nav class="nav-container" aria-label="Main Navigation">
      <ul>
        <li>
          <a href="../" aria-label="Home">
            <i class="fa fa-chevron-right" aria-hidden="true"></i>
          </a>
        </li>
        <li>
          <a href="../graph/" aria-label="Graph">
            <i class="fa fa-connectdevelop" aria-hidden="true"></i>
          </a>
        </li>
        <li class="is-current-page">
          <a href="./" aria-label="Terminal">
            <i class="fa fa-code" aria-hidden="true"></i>
          </a>
        </li>
      </ul>
    </nav>
    <div class="transaction-container">
      <div class="terminal" id="terminal">
        <div
          class="terminal-output"
          id="terminalOutput"
          role="log"
          aria-live="polite"
          aria-atomic="false"
        ></div>
        <div class="terminal-prompt">
          <label for="terminalInput" class="prompt-user">lz@anki:~$</label>
          <input
            type="text"
            id="terminalInput"
            class="terminal-input"
            autocomplete="off"
            spellcheck="false"
            aria-label="Terminal command input"
            autofocus
          />
        </div>
      </div>

      <section
        id="runningAmountSection"
        class="chart-card is-hidden"
        aria-labelledby="runningAmountTitle"
      >
        <h2 id="runningAmountTitle" class="sr-only">Future Due Chart</h2>
        <div
          class="chart-container"
          role="img"
          aria-describedby="runningAmountTitle"
        >
          <canvas id="runningAmountCanvas"></canvas>
          <div
            class="chart-empty"
            id="runningAmountEmpty"
            style="display: none"
          ></div>
        </div>
        <div class="chart-legend" id="chartLegend">
          <span data-dataset-index="0" role="button" tabindex="0"
            ><i class="legend-color color-mature"></i> Mature</span
          >
          <span data-dataset-index="1" role="button" tabindex="0"
            ><i class="legend-color color-young"></i> Young</span
          >
        </div>
      </section>

      <div class="table-responsive-container is-hidden" aria-live="polite">
        <table id="transactionTable">
          <thead>
            <tr>
              <th
                id="header-tradeDate"
                class="sortable"
                tabindex="0"
                aria-sort="none"
              >
                Date<span class="sort-indicator"></span>
              </th>
              <th id="header-orderType" class="filterable" tabindex="0">
                Type
                <span class="filter-indicator" aria-hidden="true">
                  <i class="fa fa-filter" aria-hidden="true"></i>
                </span>
              </th>
              <th
                id="header-security"
                class="sortable filterable"
                tabindex="0"
                aria-sort="none"
              >
                Security
                <span class="sort-indicator"></span>
                <span class="filter-indicator" aria-hidden="true">
                  <i class="fa fa-filter" aria-hidden="true"></i>
                </span>
              </th>
              <th>Quantity</th>
              <th>Price</th>
              <th
                id="header-netAmount"
                class="sortable"
                tabindex="0"
                aria-sort="none"
              >
                Amount<span class="sort-indicator"></span>
              </th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="transactionBody"></tbody>
        </table>
      </div>

      <div
        id="error"
        class="error"
        style="display: none"
        aria-live="assertive"
        role="alert"
      ></div>
    </div>

    <footer>
      <a
        href="https://github.com/ryusoh"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub Profile"
        ><i
          class="fa fa-github"
          style="color: #aaa; opacity: 0.5"
          aria-hidden="true"
        ></i
      ></a>
    </footer>
