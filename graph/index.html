<!doctype html>
<html>
  <head>
    <title>Anki Graph</title>
    <link
      rel="shortcut icon"
      href="/assets/icons/icon-180.png"
      type="image/png"
    />
    <link rel="icon" href="/assets/icons/icon-180.png" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/icons/icon-180.png" />
    <link rel="bookmark" href="/assets/icons/icon-180.png" type="image/png" />
    <link rel="stylesheet" href="/css/graph.css" />
  </head>

  <body>
    <div id="loading">
      <div class="spinner"></div>
    </div>

    <div id="timeline">
      <div id="timeline-controls">
        <span id="date-display">Select a date</span>
        <input type="range" id="timeline-slider" min="0" max="100" value="0" />
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
          "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/",
          "#js/": "/js/",
          "#data/": "/data/"
        }
      }
    </script>
    <script type="module" src="/js/graph/graph.js?v=2"></script>
  </body>
</html>
