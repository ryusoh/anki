<!doctype html>
<html>
  <head>
    <title>Graph</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        overflow: hidden;
        background: #000;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      canvas {
        display: block;
      }

      #node-info {
        position: fixed;
        bottom: 30px;
        left: 30px;
        color: #fff;
        background: rgba(20, 20, 30, 0.95);
        padding: 20px;
        border-radius: 12px;
        border: 1px solid rgba(102, 126, 234, 0.3);
        z-index: 1000;
        max-width: 350px;
        display: none;
      }

      #node-info h2 {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 12px;
        color: #667eea;
      }

      .stat {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        font-size: 13px;
      }

      .label {
        color: #888;
      }

      .value {
        color: #fff;
        font-weight: 500;
      }

      #close {
        position: absolute;
        top: 12px;
        right: 15px;
        cursor: pointer;
        font-size: 20px;
        color: #666;
        transition: color 0.3s;
      }

      #close:hover {
        color: #fff;
      }

      #loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #fff;
        text-align: center;
        z-index: 2000;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(102, 126, 234, 0.3);
        border-top-color: #667eea;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 15px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="loading">
      <div class="spinner"></div>
    </div>

    <div id="node-info">
      <span id="close">&times;</span>
      <h2 id="ni-title">Node</h2>
      <div class="stat">
        <span class="label">Deck</span><span class="value" id="ni-deck"></span>
      </div>
      <div class="stat">
        <span class="label">PageRank</span
        ><span class="value" id="ni-pr"></span>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
          "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";

      const info = document.getElementById("info");
      const loading = document.getElementById("loading");
      const nodeInfo = document.getElementById("node-info");

      // Load data
      const response = await fetch("/graph/graph_data.json");
      const data = await response.json();

      // Scene with subtle fog
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050510);
      scene.fog = new THREE.FogExp2(0x050510, 0.002);

      // Camera
      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        5000,
      );
      camera.position.set(0, 0, 1000);

      // Renderer with better quality
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance",
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      // Controls
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.minDistance = 100;
      controls.maxDistance = 2000;

      // Lights for depth
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambientLight);

      const pointLight = new THREE.PointLight(0x667eea, 1, 1000);
      pointLight.position.set(200, 200, 200);
      scene.add(pointLight);

      // Generate beautiful deck colors AND assign cluster positions
      const deckColors = {};
      const deckAngles = {}; // Angle for cluster positioning
      const colorPalette = [
        "#667eea",
        "#764ba2",
        "#f093fb",
        "#f5576c",
        "#4facfe",
        "#00f2fe",
        "#43e97b",
        "#38f9d7",
        "#fa709a",
        "#fee140",
        "#30cfd0",
        "#330867",
      ];

      let colorIndex = 0;
      let deckIndex = 0;

      // First pass: assign angles to decks (spread them in circle)
      const uniqueDecks = [...new Set(data.nodes.map((n) => n.deck))];
      uniqueDecks.forEach((deck) => {
        deckAngles[deck] = (deckIndex / uniqueDecks.length) * Math.PI * 2;
        deckColors[deck] = colorPalette[colorIndex % colorPalette.length];
        colorIndex++;
        deckIndex++;
      });

      const clusterRadius = 400;
      const clusterSpread = 250;
      const nodeRadius = 8;

      // --- NODES (OPTIMIZED WITH INSTANCED MESH) ---
      const nodeCount = data.nodes.length;
      const geometry = new THREE.SphereGeometry(nodeRadius, 8, 8); // Reduced segments for performance
      const material = new THREE.MeshPhongMaterial({
        shininess: 100,
        specular: 0x444444,
        vertexColors: false, // Don't use vertex colors on the geometry itself
      });

      const instancedMesh = new THREE.InstancedMesh(
        geometry,
        material,
        nodeCount,
      );
      const dummy = new THREE.Object3D();
      const color = new THREE.Color();

      // Map for O(1) position lookup during edge creation
      const nodeMap = new Map();

      data.nodes.forEach((node, i) => {
        const deckAngle = deckAngles[node.deck] || 0;

        // Position logic
        const px =
          node.x ||
          Math.cos(deckAngle) * clusterRadius +
            (Math.random() - 0.5) * clusterSpread;
        const py =
          node.y ||
          Math.sin(deckAngle) * clusterRadius +
            (Math.random() - 0.5) * clusterSpread;
        const pz = node.z || (Math.random() - 0.5) * 150;

        nodeMap.set(node.id, { x: px, y: py, z: pz });

        dummy.position.set(px, py, pz);

        // Scale logic
        const baseScale = 0.3 + node.pagerank * 200;
        const finalScale = Math.max(0.3, Math.min(3, baseScale));
        dummy.scale.setScalar(finalScale);
        dummy.updateMatrix();

        instancedMesh.setMatrixAt(i, dummy.matrix);

        // Color logic
        color.set(deckColors[node.deck] || "#ffffff");
        instancedMesh.setColorAt(i, color);

        // Store node data for raycasting
        // InstancedMesh doesn't have userData per instance, so we'll need to map back via instanceId
      });

      scene.add(instancedMesh);

      // --- EDGES (OPTIMIZED O(N+M) CONSTRUCTION) ---
      const edgePositions = [];
      const edgeColorsArray = [];

      data.links.forEach((link) => {
        const sourcePos = nodeMap.get(link.source);
        const targetPos = nodeMap.get(link.target);

        if (sourcePos && targetPos) {
          // Source
          edgePositions.push(sourcePos.x, sourcePos.y, sourcePos.z);
          // Target
          edgePositions.push(targetPos.x, targetPos.y, targetPos.z);

          // Get source node for color (from links data or lookup)
          // Since we don't have source node object easily, we'll look up by ID if needed,
          // but it's faster if the link data has metadata.
          // For now, let's assume source color.
          const sourceNode = data.nodes.find((n) => n.id === link.source);
          const c = new THREE.Color(
            deckColors[sourceNode ? sourceNode.deck : ""] || "#4facfe",
          );
          edgeColorsArray.push(c.r, c.g, c.b, 0.3); // source vertex
          edgeColorsArray.push(c.r, c.g, c.b, 0.3); // target vertex
        }
      });

      const edgeGeometry = new THREE.BufferGeometry();
      edgeGeometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(edgePositions, 3),
      );
      edgeGeometry.setAttribute(
        "color",
        new THREE.Float32BufferAttribute(edgeColorsArray, 4),
      );

      const edgeMaterial = new THREE.LineBasicMaterial({
        vertexColors: true,
        transparent: true,
        opacity: 0.5,
        blending: THREE.AdditiveBlending,
      });

      const edges = new THREE.LineSegments(edgeGeometry, edgeMaterial);
      scene.add(edges);

      loading.style.display = "none";

      // Click handler with InstancedMesh support
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      window.addEventListener("click", (event) => {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(instancedMesh);

        if (intersects.length > 0) {
          const instanceId = intersects[0].instanceId;
          const node = data.nodes[instanceId];

          document.getElementById("ni-title").textContent =
            node.label.startsWith("Note_") ? node.label : "Node Info";
          document.getElementById("ni-deck").textContent = node.deck;
          document.getElementById("ni-pr").textContent = (
            node.pagerank * 1000
          ).toFixed(3);

          nodeInfo.style.display = "block";
        }
      });

      document.getElementById("close").onclick = () => {
        nodeInfo.style.display = "none";
      };

      // Animation with gentle rotation
      let time = 0;
      function animate() {
        requestAnimationFrame(animate);
        time += 0.001;

        // Gentle rotation
        instancedMesh.rotation.y = Math.sin(time) * 0.05;
        edges.rotation.y = Math.sin(time) * 0.05;

        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      // Resize handler
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
