<!doctype html>
<html>
  <head>
    <title>MINIMAL TEST</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #status {
        position: fixed;
        top: 10px;
        left: 10px;
        color: #0f0;
        font-family: monospace;
        font-size: 16px;
        background: rgba(0, 0, 0, 0.9);
        padding: 20px;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <div id="status">Starting test...</div>
    <script type="module">
      const status = document.getElementById("status");

      try {
        // STEP 1: Check if Three.js loads
        status.innerHTML += "<br>📦 Loading Three.js...";
        const THREE =
          await import("https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js");
        status.innerHTML += " ✅<br>📦 Creating scene...";

        // STEP 2: Create scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // STEP 3: Create camera
        const camera = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          1000,
        );
        camera.position.z = 100;

        // STEP 4: Create renderer
        status.innerHTML += " ✅<br>📦 Creating renderer...";
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        status.innerHTML +=
          " ✅<br>📦 Canvas size: " +
          renderer.domElement.clientWidth +
          "x" +
          renderer.domElement.clientHeight;

        // STEP 5: Create a BIG green sphere (can't miss it)
        status.innerHTML += "<br>📦 Creating GREEN SPHERE...";
        const geometry = new THREE.SphereGeometry(50, 32, 32);
        const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        status.innerHTML +=
          " ✅<br>📦 Scene children: " + scene.children.length;

        // STEP 6: Render ONCE
        status.innerHTML += "<br>📦 Rendering...";
        renderer.render(scene, camera);
        status.innerHTML += " ✅";

        // STEP 7: Check if canvas has content
        setTimeout(() => {
          const pixel = new Uint8Array(4);
          renderer.readRenderTargetPixels(
            null,
            window.innerWidth / 2,
            window.innerHeight / 2,
            1,
            1,
            pixel,
          );
          status.innerHTML +=
            "<br>📦 Center pixel: R=" +
            pixel[0] +
            " G=" +
            pixel[1] +
            " B=" +
            pixel[2];

          if (pixel[1] > 100) {
            status.innerHTML +=
              "<br><br>✅✅✅ SUCCESS! You should see a GREEN SPHERE! ✅✅✅";
          } else {
            status.innerHTML += "<br><br>❌ Canvas is black! WebGL issue!";
          }
        }, 1000);

        status.innerHTML +=
          "<br><br>If you see a GREEN SPHERE, Three.js works!<br>If not, WebGL is broken.";
      } catch (e) {
        status.innerHTML += "<br><br>❌ ERROR: " + e.message;
        console.error(e);
      }
    </script>
  </body>
</html>
