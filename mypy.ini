[mypy]
python_version = 3.9
warn_unused_configs = True
warn_redundant_casts = True
no_implicit_optional = True

# aqt/anki are mocked in tests and provided by the Anki runtime; third-party
# libs ship no stubs. Don't fail on missing imports.
ignore_missing_imports = True

# Only type-check first-party addon source (third-party addons excluded).
exclude = (?x)(
    ^awesome_tts/
  | ^review_heatmap/
  | ^enhance_main_window/
  | ^custom_background/
  | ^animated_glass_background/
  | ^node_modules/
  | ^\.venv/
  | ^venv/
  | /tests/
  )
