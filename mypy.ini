[mypy]
python_version = 3.9
warn_unused_configs = True
warn_redundant_casts = True
no_implicit_optional = True

# aqt/anki are mocked in tests and provided by the Anki runtime; third-party
# libs ship no stubs. Don't fail on missing imports.
ignore_missing_imports = True

# Type-check addon source; exclude only vendored code and tests.
exclude = (?x)(
    ^review_heatmap/libaddon/
  | /_vendor/
  | /_vendor_legacy/
  | ^node_modules/
  | ^\.venv/
  | ^venv/
  | /tests/
  )

[mypy-review_heatmap.libaddon.*]
ignore_errors = True

